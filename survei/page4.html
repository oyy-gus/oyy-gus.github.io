<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuesioner Koperasi - Bagian C (21-30)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <h1>📋 Kuesioner Koperasi</h1>
                <p>Bagian C – Pengetahuan Perkoperasian (21-30)</p>
            </div>
            <div class="theme-toggle">
                <span class="toggle-label">Mode</span>
                <div class="toggle-switch" id="themeToggle">
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </header>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Progress Pengisian</span>
                <span class="progress-text">Halaman 4 dari 4</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 100%"></div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="form-card" style="background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: white;">
            <p style="margin: 0; font-size: 1rem;">
                <strong>📌 Petunjuk:</strong> Ini adalah halaman terakhir. Pilih <strong>Benar</strong>, <strong>Salah</strong>, atau <strong>Tidak Tahu</strong> untuk setiap pernyataan.
            </p>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <h2 class="section-title">
                <span class="icon">🧠</span>
                Pengetahuan Perkoperasian (21-30)
            </h2>

            <!-- C21 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">21</span>
                    Rapat anggota diadakan minimal sekali setahun.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c21" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c21" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c21" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C22 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">22</span>
                    Koperasi jasa menyediakan layanan non-barang, misalnya transportasi.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c22" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c22" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c22" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C23 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">23</span>
                    Sisa hasil usaha disetor seluruhnya ke pemerintah.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c23" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c23" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c23" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C24 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">24</span>
                    Pengawas koperasi bertugas memeriksa kegiatan usaha.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c24" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c24" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c24" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C25 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">25</span>
                    Koperasi boleh berdiri dengan minimal 20 orang pendiri.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c25" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c25" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c25" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C26 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">26</span>
                    Koperasi dapat berperan dalam pembangunan ekonomi daerah.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c26" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c26" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c26" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C27 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">27</span>
                    Pendidikan perkoperasian wajib diberikan kepada anggota.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c27" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c27" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c27" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C28 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">28</span>
                    Setiap koperasi wajib membuat laporan keuangan tahunan.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c28" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c28" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c28" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C29 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">29</span>
                    Koperasi tidak boleh memiliki cabang.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c29" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c29" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c29" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C30 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">30</span>
                    Koperasi berlandaskan Pancasila dan UUD 1945.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c30" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c30" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c30" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="prevPage('page3.html')">
                ← Sebelumnya
            </button>
            <button class="btn btn-primary" onclick="submitForm()" style="background: linear-gradient(135deg, #4CAF50, #2E7D32);">
                ✓ Kirim Jawaban
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Mengirim data ke server...</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
