<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuesioner Koperasi - Bagian C (11-20)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <h1>📋 Kuesioner Koperasi</h1>
                <p>Bagian C – Pengetahuan Perkoperasian (11-20)</p>
            </div>
            <div class="theme-toggle">
                <span class="toggle-label">Mode</span>
                <div class="toggle-switch" id="themeToggle">
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </header>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Progress Pengisian</span>
                <span class="progress-text">Halaman 3 dari 4</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 75%"></div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="form-card" style="background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: white;">
            <p style="margin: 0; font-size: 1rem;">
                <strong>📌 Petunjuk:</strong> Pilih <strong>Benar</strong>, <strong>Salah</strong>, atau <strong>Tidak Tahu</strong> untuk setiap pernyataan berikut.
            </p>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <h2 class="section-title">
                <span class="icon">🧠</span>
                Pengetahuan Perkoperasian (11-20)
            </h2>

            <!-- C11 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">11</span>
                    Prinsip koperasi meliputi keanggotaan sukarela dan terbuka.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c11" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c11" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c11" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C12 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">12</span>
                    Pengurus koperasi dipilih oleh rapat anggota.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c12" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c12" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c12" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C13 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">13</span>
                    Koperasi dapat beroperasi tanpa modal awal.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c13" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c13" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c13" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C14 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">14</span>
                    Simpanan wajib bersifat sukarela.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c14" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c14" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c14" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C15 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">15</span>
                    Koperasi primer beranggotakan orang per orang.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c15" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c15" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c15" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C16 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">16</span>
                    Koperasi sekunder beranggotakan koperasi lain.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c16" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c16" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c16" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C17 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">17</span>
                    Tujuan koperasi adalah meningkatkan kesejahteraan anggota.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c17" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c17" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c17" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C18 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">18</span>
                    Setiap anggota dapat menjadi pengurus tanpa batas waktu.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c18" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c18" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c18" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C19 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">19</span>
                    Modal koperasi berasal dari simpanan pokok, wajib, dan hibah.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c19" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c19" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c19" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C20 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">20</span>
                    Pemerintah wajib menjadi anggota koperasi.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c20" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c20" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c20" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="prevPage('page2.html')">
                ← Sebelumnya
            </button>
            <button class="btn btn-primary" onclick="nextPage(3, 'page4.html')">
                Selanjutnya →
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Menyimpan data...</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
