<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuesioner Koperasi - Bagian C (1-10)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <h1>📋 Kuesioner Koperasi</h1>
                <p>Bagian C – Pengetahuan Perkoperasian (1-10)</p>
            </div>
            <div class="theme-toggle">
                <span class="toggle-label">Mode</span>
                <div class="toggle-switch" id="themeToggle">
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </header>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Progress Pengisian</span>
                <span class="progress-text">Halaman 2 dari 4</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 50%"></div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="form-card" style="background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: white;">
            <p style="margin: 0; font-size: 1rem;">
                <strong>📌 Petunjuk:</strong> Pilih <strong>Benar</strong>, <strong>Salah</strong>, atau <strong>Tidak Tahu</strong> untuk setiap pernyataan berikut.
            </p>
        </div>

        <!-- Form Card -->
        <div class="form-card">
            <h2 class="section-title">
                <span class="icon">🧠</span>
                Pengetahuan Perkoperasian (1-10)
            </h2>

            <!-- C1 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">1</span>
                    Koperasi bertujuan mencari keuntungan sebesar-besarnya.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c1" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c1" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c1" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C2 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">2</span>
                    Anggota koperasi memiliki hak suara yang sama tanpa memandang besar simpanan.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c2" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c2" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c2" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C3 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">3</span>
                    Simpanan pokok dapat diambil kapan saja.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c3" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c3" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c3" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C4 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">4</span>
                    Koperasi didirikan berdasarkan prinsip demokrasi ekonomi.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c4" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c4" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c4" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C5 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">5</span>
                    Anggota koperasi adalah pemilik sekaligus pengguna jasa koperasi.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c5" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c5" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c5" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C6 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">6</span>
                    Sisa hasil usaha dibagi berdasarkan modal yang ditanam.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c6" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c6" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c6" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C7 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">7</span>
                    Koperasi simpan pinjam hanya boleh melayani anggotanya.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c7" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c7" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c7" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C8 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">8</span>
                    Koperasi konsumsi menyediakan barang kebutuhan sehari-hari.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c8" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c8" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c8" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C9 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">9</span>
                    Rapat anggota adalah pemegang kekuasaan tertinggi dalam koperasi.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c9" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c9" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c9" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>

            <!-- C10 -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">10</span>
                    Koperasi tidak wajib berbadan hukum.
                </label>
                <div class="tfu-options">
                    <label class="option-item true-opt">
                        <input type="radio" name="c10" value="Benar">
                        <span class="option-label">✓ Benar</span>
                    </label>
                    <label class="option-item false-opt">
                        <input type="radio" name="c10" value="Salah">
                        <span class="option-label">✗ Salah</span>
                    </label>
                    <label class="option-item unknown-opt">
                        <input type="radio" name="c10" value="Tidak Tahu">
                        <span class="option-label">? Tidak Tahu</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="prevPage('index.html')">
                ← Sebelumnya
            </button>
            <button class="btn btn-primary" onclick="nextPage(2, 'page3.html')">
                Selanjutnya →
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Menyimpan data...</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
