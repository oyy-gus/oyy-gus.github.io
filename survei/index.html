<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuesioner Koperasi - Bagian A & B</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <h1>📋 Kuesioner Koperasi</h1>
                <p>Penelitian Pengetahuan Perkoperasian</p>
            </div>
            <div class="theme-toggle">
                <span class="toggle-label">Mode</span>
                <div class="toggle-switch" id="themeToggle">
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </header>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-title">Progress Pengisian</span>
                <span class="progress-text">Halaman 1 dari 4</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 25%"></div>
            </div>
        </div>

        <!-- Form Card - Bagian A -->
        <div class="form-card">
            <h2 class="section-title">
                <span class="icon">👤</span>
                Bagian A – Data Diri
            </h2>

            <!-- 1. Usia -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">1</span>
                    Usia
                </label>
                <input type="number" name="a1_usia" placeholder="Masukkan usia Anda" min="10" max="100">
            </div>

            <!-- 2. Jenis Kelamin -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">2</span>
                    Jenis Kelamin
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="a2_jenis_kelamin" value="Laki-laki">
                        <span class="option-label">Laki-laki</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a2_jenis_kelamin" value="Perempuan">
                        <span class="option-label">Perempuan</span>
                    </label>
                </div>
            </div>

            <!-- 3. Pendidikan -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">3</span>
                    Pendidikan Terakhir
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="a3_pendidikan" value="SD">
                        <span class="option-label">SD</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a3_pendidikan" value="SMP">
                        <span class="option-label">SMP</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a3_pendidikan" value="SMA">
                        <span class="option-label">SMA</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a3_pendidikan" value="Diploma">
                        <span class="option-label">Diploma</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a3_pendidikan" value="S1">
                        <span class="option-label">S1</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a3_pendidikan" value="S2">
                        <span class="option-label">S2</span>
                    </label>
                </div>
            </div>

            <!-- 4. Pekerjaan -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">4</span>
                    Pekerjaan
                </label>
                <input type="text" name="a4_pekerjaan" placeholder="Masukkan pekerjaan Anda">
            </div>

            <!-- 5. Pendapatan -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">5</span>
                    Pendapatan per Bulan (Rp)
                </label>
                <input type="text" name="a5_pendapatan" placeholder="Contoh: 5000000">
            </div>

            <!-- 6. Lokasi -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">6</span>
                    Lokasi Tempat Tinggal
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="a6_lokasi" value="Kota">
                        <span class="option-label">🏙️ Kota</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="a6_lokasi" value="Desa">
                        <span class="option-label">🏡 Desa</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Form Card - Bagian B -->
        <div class="form-card">
            <h2 class="section-title">
                <span class="icon">📚</span>
                Bagian B – Akses Informasi dan Pengalaman
            </h2>

            <!-- 7. Anggota Koperasi -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">7</span>
                    Pernah menjadi anggota koperasi?
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="b7_anggota_koperasi" value="Ya">
                        <span class="option-label">✅ Ya</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b7_anggota_koperasi" value="Tidak">
                        <span class="option-label">❌ Tidak</span>
                    </label>
                </div>
            </div>

            <!-- 8. Lama Anggota -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">8</span>
                    Lama menjadi anggota koperasi
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="b8_lama_anggota" value="< 1 tahun">
                        <span class="option-label">&lt; 1 tahun</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b8_lama_anggota" value="1-3 tahun">
                        <span class="option-label">1–3 tahun</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b8_lama_anggota" value="> 3 tahun">
                        <span class="option-label">&gt; 3 tahun</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b8_lama_anggota" value="Tidak pernah">
                        <span class="option-label">Tidak pernah</span>
                    </label>
                </div>
            </div>

            <!-- 9. Sumber Informasi -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">9</span>
                    Sumber informasi utama tentang koperasi
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="b9_sumber_informasi" value="Media sosial">
                        <span class="option-label">📱 Media Sosial</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b9_sumber_informasi" value="Penyuluhan">
                        <span class="option-label">📢 Penyuluhan</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b9_sumber_informasi" value="Sekolah">
                        <span class="option-label">🏫 Sekolah</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b9_sumber_informasi" value="Keluarga">
                        <span class="option-label">👨‍👩‍👧 Keluarga</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b9_sumber_informasi" value="Lainnya" data-show-conditional="b9_lainnya_input">
                        <span class="option-label">📝 Lainnya</span>
                    </label>
                </div>
                <div class="conditional-input" id="b9_lainnya_input">
                    <input type="text" name="b9_lainnya" placeholder="Sebutkan sumber informasi lainnya...">
                </div>
            </div>

            <!-- 10. Frekuensi Kegiatan -->
            <div class="question-group" data-required="true">
                <label class="question-label">
                    <span class="question-number">10</span>
                    Frekuensi mengikuti kegiatan koperasi
                </label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="b10_frekuensi" value="Sering">
                        <span class="option-label">🔄 Sering</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b10_frekuensi" value="Kadang">
                        <span class="option-label">⏱️ Kadang</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="b10_frekuensi" value="Tidak pernah">
                        <span class="option-label">❌ Tidak pernah</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <button class="btn btn-secondary" disabled>
                ← Sebelumnya
            </button>
            <button class="btn btn-primary" onclick="nextPage(1, 'page2.html')">
                Selanjutnya →
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Menyimpan data...</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
